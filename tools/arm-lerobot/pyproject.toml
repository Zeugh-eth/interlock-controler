[project]
name = "arm-lerobot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.10",
    "clip",
    "lap>=0.5.13",
    "lerobot[dataset,feetech]>=0.6.1",
    "mcp>=2.3.0",
    "opencv-python>=5.0.0.93",
    "scipy>=1.18.1",
    "transformers>=5.20.2",
    "ultralytics>=8.4.123",
]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-aiohttp>=1.1.1",
]
